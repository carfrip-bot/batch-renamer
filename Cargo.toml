[package]
name = "batch-renamer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "=0.27.2"
rfd = "0.14"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
